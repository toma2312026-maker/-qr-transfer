<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRコード送受信システム</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;margin:16px;background:#f7f8fa;color:#202124}
button,input{font:inherit}
button{padding:11px 16px;margin:5px;border:0;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input{padding:11px;border:1px solid #bbb;border-radius:9px;width:min(100%,290px);margin:6px;text-align:center}
#settingsIcon{position:fixed;top:10px;right:12px;font-size:25px;cursor:pointer;z-index:5}
#settingsModal{display:none;position:fixed;z-index:10;top:8%;left:5%;right:5%;background:#fff;border:1px solid #bbb;border-radius:14px;padding:16px;max-height:82%;overflow:auto;box-shadow:0 8px 30px #0002}
.card{background:#fff;border:1px solid #d7dbe0;border-radius:14px;padding:16px;margin:13px auto;max-width:460px;box-shadow:0 2px 8px #00000008}
.hidden{display:none!important}
.small{font-size:13px;color:#666}
#receiverCode{font-size:clamp(32px,9vw,46px);font-weight:800;letter-spacing:5px;overflow-wrap:anywhere;margin:8px 0}
#receiverQr{display:flex;justify-content:center;align-items:center;min-height:180px;margin:12px auto}
#receiverQr img,#receiverQr canvas{max-width:100%;height:auto!important}
.status{font-weight:700;padding:9px;border-radius:9px;background:#eef2f7;margin:10px 0}
.status.ok{color:#087443;background:#e8f7ef}
.status.error{color:#b42318;background:#fff0ee}

/* カメラ映像を読み取り枠の中だけに表示 */
#cameraBox,.scanViewport{
  position:relative;
  width:min(78vw,300px);
  aspect-ratio:1;
  margin:12px auto;
  overflow:hidden;
  border:3px solid #ef4444;
  border-radius:14px;
  background:#111;
}
#cameraBox video,.scanViewport video{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
#overlay{
  position:absolute;
  inset:0;
  border:0;
  pointer-events:none;
}
.cameraActions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.secondary{background:#e8edf5;color:#243247}
.tinyButton{font-size:13px;padding:7px 11px;background:#e8edf5;color:#243247}
#codeList input{text-align:left}
</style>
</head>
<body>

<span id="settingsIcon" aria-label="設定">⚙️</span>
<h2>QRコード送受信システム</h2>

<div id="firebaseWarning" class="card">
<b>最初の設定が必要です</b><br>
このHTML内のFirebase設定欄に、自分のFirebaseプロジェクト設定を入れてください。
</div>

<div id="modeSelect" class="card">
<h3>モードを選択</h3>
<button id="senderBtn">📤 送信</button>
<button id="receiverBtn">📥 受信</button>
</div>

<!-- 送信側 -->
<div id="senderScreen" class="hidden">
  <div class="card" id="connectCard">
    <h3>📥 受信側に接続</h3>
    <p>受信側の画面に表示されたQRコードを読み取ってください。</p>

    <button id="startConnectScanBtn">📷 QRコードを読み取る</button>

    <div id="connectCameraBox" class="hidden">
      <div id="connectCameraFrame" class="scanViewport">
        <video id="connectVideo" playsinline></video>
      </div>

      <div class="cameraActions">
        <button id="connectTorchBtn" class="secondary">🔦 ライト ON</button>
        <button id="stopConnectScanBtn" class="secondary">読み取りを閉じる</button>
      </div>

      <p id="connectScanMessage" class="small">QRコードを枠内に合わせてください。</p>
    </div>

    <p><button id="manualToggleBtn" class="tinyButton">コードを手入力する</button></p>

    <div id="manualInputBox" class="hidden">
      <input id="connectCode" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="例：A7K2P9">
      <br>
      <button id="connectBtn">接続</button>
    </div>

    <div id="connectMessage" class="small" aria-live="polite"></div>
  </div>

  <div class="card hidden" id="senderReady">
    <h3>📤 送信モード</h3>
    <p id="senderDestination"></p>
    <div id="senderStatus" class="status">接続を確認中…</div>
    <button id="reconnectBtn" class="hidden">↻ 再接続</button>
    <hr>

    <p>送信するQRコードを読み取ってください。</p>
    <button id="startScanBtn">▶ QR読み取り開始</button>

    <div class="cameraActions">
      <button id="payloadTorchBtn" class="secondary hidden">🔦 ライト ON</button>
      <button id="stopPayloadScanBtn" class="secondary hidden">読み取りを停止</button>
    </div>

    <p id="senderResult"></p>

    <div id="cameraBox" class="hidden">
      <video id="video" playsinline></video>
      <div id="overlay"></div>
    </div>
  </div>
</div>

<!-- 受信側 -->
<div id="receiverScreen" class="hidden">
  <div class="card">
    <h3>📥 受信モード</h3>
    <p>送信側でこのQRコードを読み取ってください。</p>
    <div id="receiverQr"></div>
    <div id="receiverCode">------</div>
    <button id="copyCodeBtn" class="secondary">コードをコピー</button>
    <div id="receiverExpiry" class="small">有効期限：10:00</div>
    <div id="statusReceiver" class="status">受信待機中</div>
    <p id="receiverResult"></p>
  </div>
</div>

<audio id="correctSound"></audio>
<audio id="wrongSound"></audio>

<div id="settingsModal">
  <h3>設定</h3>
  <label>正解コード</label><br>
  <div id="codeList"></div>
  <button id="addCodeBtn" class="secondary">＋追加</button>
  <hr>
  <label>正解音</label><br>
  <input type="file" id="correctSoundFile" accept="audio/*,.mp3,.wav,.m4a"><br><br>
  <label>不正解音</label><br>
  <input type="file" id="wrongSoundFile" accept="audio/*,.mp3,.wav,.m4a"><br><br>
  <button id="saveSettingsBtn">保存</button>
  <button id="closeSettingsBtn" class="secondary">閉じる</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  get,
  onValue,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

/* ===== Firebase設定 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyABSz7WUs2QomfCiuiPBF4F2i64ZtFVsnE",
  authDomain: "qrtransfer-b5da2.firebaseapp.com",
  databaseURL: "https://qrtransfer-b5da2-default-rtdb.firebaseio.com",
  projectId: "qrtransfer-b5da2",
  storageBucket: "qrtransfer-b5da2.firebasestorage.app",
  messagingSenderId: "382295952066",
  appId: "1:382295952066:web:bfc8b93afe49773a36c95b"
};
/* ======================== */

const CODE_LENGTH = 6;
const CODE_LIFETIME_MS = 10 * 60 * 1000;
const CODE_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const configured = !Object.values(firebaseConfig).some(v => String(v).includes("ここに"));
document.getElementById("firebaseWarning").classList.toggle("hidden", configured);

let db = null;

if (configured) {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
}

let mode = "";
let receiverCode = "";
let correctCodes = [];
let receiverUnsub = null;
let receiverExpiryTimer = null;
let cameraStream = null;
let scanFrame = null;
let lastScanned = "";
let activeScanner = "";
let torchOn = false;

const $ = id => document.getElementById(id);

const video = $("video");
const connectVideo = $("connectVideo");
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

const correctSound = $("correctSound");
const wrongSound = $("wrongSound");

function path(code) {
  return "qrReceivers/" + code;
}

function makeCode() {
  let result = "";

  for (let i = 0; i < CODE_LENGTH; i++) {
    result += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  }

  return result;
}

function normalizeCode(value) {
  return String(value || "")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "")
    .slice(0, CODE_LENGTH);
}

function stopCamera() {
  if (scanFrame) cancelAnimationFrame(scanFrame);
  scanFrame = null;

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
  }

  cameraStream = null;
  torchOn = false;

  if (video) video.srcObject = null;
  if (connectVideo) connectVideo.srcObject = null;

  $("connectCameraBox").classList.add("hidden");
  $("cameraBox").classList.add("hidden");

  $("connectTorchBtn").textContent = "🔦 ライト ON";
  $("payloadTorchBtn").textContent = "🔦 ライト ON";
  $("payloadTorchBtn").classList.add("hidden");
  $("stopPayloadScanBtn").classList.add("hidden");
}

function setStatus(message, kind = "") {
  const el = $("senderStatus");
  el.textContent = message;
  el.className = "status" + (kind ? " " + kind : "");
}

async function toggleTorch(button) {
  if (!cameraStream) return;

  const track = cameraStream.getVideoTracks()[0];
  const capabilities = track.getCapabilities ? track.getCapabilities() : {};

  if (!capabilities.torch) {
    alert("この端末またはブラウザではライト機能を利用できません。");
    return;
  }

  try {
    torchOn = !torchOn;

    await track.applyConstraints({
      advanced: [{ torch: torchOn }]
    });

    button.textContent = torchOn ? "🔦 ライト OFF" : "🔦 ライト ON";

  } catch (error) {
    torchOn = false;
    alert("ライトを切り替えられませんでした。");
  }
}

async function startCamera(videoElement, scannerType) {
  stopCamera();

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("カメラを使うにはHTTPSで開いてください。iPhoneではSafariで公開URLを開いてください。");
    return false;
  }

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" }
      }
    });

    activeScanner = scannerType;
    videoElement.srcObject = cameraStream;
    videoElement.setAttribute("playsinline", "true");

    await videoElement.play();

    return true;

  } catch (error) {
    stopCamera();
    alert("カメラを使用できません: " + error.message);
    return false;
  }
}

/* 読み取り枠内だけをQR読み取り対象にする */
function beginScan(videoElement, onFound) {
  const scan = () => {
    if (!cameraStream) return;

    if (
      videoElement.readyState === videoElement.HAVE_ENOUGH_DATA &&
      window.jsQR
    ) {
      const side = Math.min(
        videoElement.videoWidth,
        videoElement.videoHeight
      );

      const sx = Math.floor(
        (videoElement.videoWidth - side) / 2
      );

      const sy = Math.floor(
        (videoElement.videoHeight - side) / 2
      );

      canvas.width = side;
      canvas.height = side;

      if (canvas.width && canvas.height) {
        ctx.drawImage(
          videoElement,
          sx,
          sy,
          side,
          side,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const imageData = ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

        const result = window.jsQR(
          imageData.data,
          imageData.width,
          imageData.height
        );

        if (result && result.data) {
          onFound(result.data);
        }
      }
    }

    if (cameraStream) {
      scanFrame = requestAnimationFrame(scan);
    }
  };

  scanFrame = requestAnimationFrame(scan);
}

/* モード選択 */
$("senderBtn").onclick = () => {
  mode = "sender";

  $("modeSelect").classList.add("hidden");
  $("senderScreen").classList.remove("hidden");

  const saved = localStorage.getItem("qrReceiverCode");

  if (saved && db) {
    $("manualInputBox").classList.remove("hidden");
    $("connectCode").value = normalizeCode(saved);
    connectSender(saved, true);
  }
};

/* 受信モード */
$("receiverBtn").onclick = async () => {
  mode = "receiver";

  $("modeSelect").classList.add("hidden");
  $("receiverScreen").classList.remove("hidden");

  if (!db) {
    $("statusReceiver").textContent = "Firebase設定が必要です";
    $("statusReceiver").className = "status error";
    return;
  }

  try {
    let code = makeCode();

    for (let attempt = 0; attempt < 5; attempt++) {
      const existing = await get(ref(db, path(code)));

      if (!existing.exists()) break;

      code = makeCode();
    }

    receiverCode = code;

    const createdAt = Date.now();

    $("receiverCode").textContent = receiverCode;
    $("receiverQr").innerHTML = "";

    if (window.QRCode) {
      new QRCode($("receiverQr"), {
        text: receiverCode,
        width: 190,
        height: 190,
        correctLevel: QRCode.CorrectLevel.M
      });
    } else {
      $("receiverQr").textContent = "QRコードを表示できません。下のコードを使用してください。";
    }

    const receiverRef = ref(db, path(receiverCode));
    const onlineRef = ref(db, path(receiverCode) + "/online");

    await set(receiverRef, {
      online: true,
      createdAt,
      lastMessage: null
    });

    onDisconnect(onlineRef).set(false);

    if (receiverExpiryTimer) {
      clearInterval(receiverExpiryTimer);
    }

    const updateExpiry = async () => {
      const remaining = Math.max(
        0,
        CODE_LIFETIME_MS - (Date.now() - createdAt)
      );

      const minutes = Math.floor(remaining / 60000);
      const seconds = Math.floor((remaining % 60000) / 1000);

      $("receiverExpiry").textContent =
        `有効期限：${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

      if (remaining <= 0) {
        clearInterval(receiverExpiryTimer);

        $("statusReceiver").textContent = "コードの有効期限が切れました。";
        $("statusReceiver").className = "status error";
        $("receiverExpiry").textContent = "有効期限切れ";

        await set(onlineRef, false);
      }
    };

    updateExpiry();
    receiverExpiryTimer = setInterval(updateExpiry, 1000);

    onValue(
      ref(db, path(receiverCode) + "/lastMessage"),
      snap => {
        const data = snap.val();

        if (!data || !data.value) return;

        $("receiverResult").textContent = "受信: " + data.value;

        if (correctCodes.includes(data.value)) {
          $("statusReceiver").textContent = "⭕ 正解！";
          $("statusReceiver").className = "status ok";

          correctSound.currentTime = 0;
          correctSound.play().catch(() => {});

        } else {
          $("statusReceiver").textContent = "❌ 不正解";
          $("statusReceiver").className = "status error";

          wrongSound.currentTime = 0;
          wrongSound.play().catch(() => {});
        }
      }
    );

  } catch (error) {
    $("statusReceiver").textContent = "接続準備エラー: " + error.message;
    $("statusReceiver").className = "status error";
  }
};

/* コードコピー */
$("copyCodeBtn").onclick = async () => {
  try {
    await navigator.clipboard.writeText(receiverCode);

    $("copyCodeBtn").textContent = "コピーしました！";

    setTimeout(() => {
      $("copyCodeBtn").textContent = "コードをコピー";
    }, 1600);

  } catch {
    alert("コピーできませんでした。コードを手動でコピーしてください。");
  }
};

/* 接続用QR読み取り */
$("startConnectScanBtn").onclick = async () => {
  if (!window.jsQR) {
    alert("QR読み取りライブラリを読み込めませんでした。");
    return;
  }

  const started = await startCamera(connectVideo, "connect");

  if (!started) return;

  $("connectCameraBox").classList.remove("hidden");

  $("connectScanMessage").textContent =
    "QRコードを枠内に合わせてください。";

  beginScan(connectVideo, async raw => {
    const code = normalizeCode(raw);

    if (!new RegExp("^[A-Z0-9]{" + CODE_LENGTH + "}$").test(code)) {
      $("connectScanMessage").textContent =
        "このQRコードは接続コードではありません。";
      return;
    }

    stopCamera();

    $("connectCode").value = code;
    $("manualInputBox").classList.remove("hidden");

    $("connectMessage").textContent =
      "コードを読み取りました。接続しています…";

    await connectSender(code, false);
  });
};

$("stopConnectScanBtn").onclick = stopCamera;

$("connectTorchBtn").onclick = () => {
  toggleTorch($("connectTorchBtn"));
};

$("manualToggleBtn").onclick = () => {
  $("manualInputBox").classList.toggle("hidden");

  if (!$("manualInputBox").classList.contains("hidden")) {
    $("connectCode").focus();
  }
};

$("connectCode").addEventListener("input", () => {
  $("connectCode").value = normalizeCode($("connectCode").value);
});

$("connectBtn").onclick = () => {
  connectSender($("connectCode").value, false);
};

/* 接続処理 */
async function connectSender(rawCode, automatic) {
  const code = normalizeCode(rawCode);

  if (!new RegExp("^[A-Z0-9]{" + CODE_LENGTH + "}$").test(code)) {
    $("connectMessage").textContent =
      "6文字の英数字（アルファベットは大文字）を入力してください。";
    return;
  }

  if (!db) {
    $("connectMessage").textContent = "先にFirebase設定が必要です。";
    return;
  }

  $("connectMessage").textContent = "接続を確認中…";

  try {
    const snap = await get(ref(db, path(code)));

    if (!snap.exists()) {
      throw new Error("受信側が見つかりません。");
    }

    const data = snap.val();

    if (!data.createdAt || Date.now() - data.createdAt >= CODE_LIFETIME_MS) {
      throw new Error("接続コードの有効期限が切れています。受信側で新しいコードを発行してください。");
    }

    if (data.online !== true) {
      throw new Error("受信側がオフラインです。受信側の画面を確認してください。");
    }

    receiverCode = code;

    localStorage.setItem("qrReceiverCode", code);

    $("connectCard").classList.add("hidden");
    $("senderReady").classList.remove("hidden");

    $("senderDestination").textContent = "接続先：" + code;
    $("reconnectBtn").classList.add("hidden");
    $("connectMessage").textContent = "";

    setStatus("🟢 接続成功！", "ok");

    if (receiverUnsub) receiverUnsub();

    receiverUnsub = onValue(
      ref(db, path(code) + "/online"),
      onlineSnap => {
        if (onlineSnap.val() !== true) {
          stopCamera();

          setStatus("🔴 通信が切れました。再接続できます。", "error");
          $("reconnectBtn").classList.remove("hidden");

        } else {
          setStatus("🟢 接続中", "ok");
          $("reconnectBtn").classList.add("hidden");
        }
      }
    );

  } catch (error) {
    if (
      automatic &&
      receiverCode === code &&
      !$("senderReady").classList.contains("hidden")
    ) {
      setStatus("🔴 再接続できませんでした。もう一度お試しください。", "error");
      $("reconnectBtn").classList.remove("hidden");

    } else {
      $("connectMessage").textContent = error.message;
      $("connectCard").classList.remove("hidden");
      $("senderReady").classList.add("hidden");

      if (!automatic) {
        $("connectCode").value = code;
      }
    }
  }
}

/* 再接続 */
$("reconnectBtn").onclick = async () => {
  $("reconnectBtn").disabled = true;

  setStatus("再接続を確認中…");

  await connectSender(receiverCode, true);

  $("reconnectBtn").disabled = false;

  if (
    !$("senderReady").classList.contains("hidden") &&
    $("senderStatus").textContent.includes("通信が切れました")
  ) {
    $("reconnectBtn").classList.remove("hidden");
  }
};

/* 送信するQRコードの読み取り */
$("startScanBtn").onclick = async () => {
  const started = await startCamera(video, "payload");

  if (!started) return;

  $("cameraBox").classList.remove("hidden");
  $("payloadTorchBtn").classList.remove("hidden");
  $("stopPayloadScanBtn").classList.remove("hidden");

  $("senderResult").textContent = "QRコードを読み取り中…";

  beginScan(video, async raw => {
    if (raw === lastScanned) return;

    lastScanned = raw;

    $("senderResult").textContent = "送信: " + raw;

    try {
      await set(
        ref(db, path(receiverCode) + "/lastMessage"),
        {
          value: raw,
          time: Date.now()
        }
      );

    } catch (error) {
      setStatus("送信に失敗しました: " + error.message, "error");
    }

    setTimeout(() => {
      lastScanned = "";
    }, 1200);
  });
};

$("payloadTorchBtn").onclick = () => {
  toggleTorch($("payloadTorchBtn"));
};

$("stopPayloadScanBtn").onclick = stopCamera;

/* 設定 */
function addCodeInput(value = "") {
  const row = document.createElement("div");

  const input = document.createElement("input");

  input.type = "text";
  input.placeholder = "コード入力";
  input.value = value;

  const remove = document.createElement("button");

  remove.textContent = "削除";
  remove.className = "tinyButton";
  remove.onclick = () => row.remove();

  row.append(input, remove);

  $("codeList").appendChild(row);
}

function closeSettings() {
  $("settingsModal").style.display = "none";
}

function saveSettings() {
  correctCodes = [...document.querySelectorAll("#codeList input")]
    .map(x => x.value.trim())
    .filter(Boolean);

  localStorage.setItem(
    "qrCorrectCodes",
    JSON.stringify(correctCodes)
  );

  const c = $("correctSoundFile").files[0];
  const w = $("wrongSoundFile").files[0];

  if (c) correctSound.src = URL.createObjectURL(c);
  if (w) wrongSound.src = URL.createObjectURL(w);

  alert("保存しました");

  closeSettings();
}

$("addCodeBtn").onclick = () => addCodeInput();
$("saveSettingsBtn").onclick = saveSettings;
$("closeSettingsBtn").onclick = closeSettings;

$("settingsIcon").onclick = () => {
  $("settingsModal").style.display = "block";

  if (!$("codeList").children.length) {
    addCodeInput();
  }
};

try {
  correctCodes = JSON.parse(
    localStorage.getItem("qrCorrectCodes") || "[]"
  );
} catch {}

correctCodes.forEach(addCodeInput);

window.addEventListener("pagehide", () => {
  stopCamera();

  if (receiverExpiryTimer) {
    clearInterval(receiverExpiryTimer);
  }
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>

</body>
</html>
